name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg 설치
        # 렌더 테스트(떨림 회귀, build.sh 재현성)가 실제 ffmpeg를 필요로 합니다.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성 설치
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: ruff
        working-directory: backend
        run: uv run ruff check .

      - name: pytest
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: tsc
        working-directory: frontend
        run: npm run typecheck

      - name: 빌드
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t photo-video-tuner:ci .
      - name: 헬스체크
        run: |
          docker run -d --name tuner -p 8000:8000 photo-video-tuner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "OK"; exit 0
            fi
            sleep 2
          done
          echo "헬스체크 실패"; docker logs tuner; exit 1
