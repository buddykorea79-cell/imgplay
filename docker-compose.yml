services:
  tuner:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # 규칙 파일을 바인드해 컨테이너 안에서 튜닝한 값이 저장소에 남습니다.
      - ./grade.yaml:/app/grade.yaml
      - ./motion.yaml:/app/motion.yaml
      # 작업 산출물. 컨테이너를 지워도 중간본과 캐시가 유지됩니다.
      - ./work:/app/work
      - ./.cache:/app/.cache
      # 얼굴 검출 모델 (선택). scripts/fetch_face_model.sh로 받습니다.
      - ./backend/models:/app/backend/models
    environment:
      PVT_RENDER_PARALLEL: "3"   # 동시 ffmpeg 개수. CPU 코어에 맞춰 조정하세요.
    # restart 정책을 두지 않습니다. 내 사진을 다루는 개인용 도구가 컴퓨터를 켤
    # 때마다 백그라운드로 살아나는 건 원하는 동작이 아닙니다. 쓸 때만 띄우세요.
    stop_grace_period: 30s       # 렌더 중이면 ffmpeg가 정리될 시간을 줍니다
